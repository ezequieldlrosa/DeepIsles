[project]
name = "deepisles"
version = "1.0.0"
description = "DeepISLES - State-of-the-art ischemic stroke lesion segmentation in MRI"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    # === Core Scientific ===
    "numpy>=1.24,<2.0",
    "scipy",
    "pandas>=1.5.0,<3.0",
    "sympy==1.11.1",
    
    # === ML/DL Frameworks ===
    # PyTorch with CUDA support (installed via uv with PyTorch index)
    # CUDA version can be specified: 11.8 (default), 12, or 13
    # Note: torch>=2.1.2 is installed separately in setup_env.sh and Dockerfile
    # "torch>=2.1.2",  # Installed separately with CUDA support
    # "torchvision",  # Installed separately
    # "torchaudio",  # Installed separately
    "pytorch-lightning>=1.6.5",
    "torchmetrics>=0.9.3",
    "monai[all]>=1.4.0",
    "performer-pytorch>=1.1.4",
    
    # === Medical Imaging ===
    "nibabel>=5.0.0",
    # Note: SimpleITK-SimpleElastix includes SimpleITK functionality plus Elastix registration
    # Do NOT install both SimpleITK and SimpleITK-SimpleElastix - they conflict!
    # If both are installed, uninstall 'simpleitk' and keep 'SimpleITK-SimpleElastix'
    "SimpleITK-SimpleElastix>=2.0.0",
    "MedPy==0.4.0",
    "pydicom==2.3.0",
    "itk",
    "dcm2niix",
    "openslide-python",
    
    # === Image Processing ===
    "scikit-image>=0.20.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.8.0",
    "Pillow==10.0.1",
    "imageio==2.19.3",
    
    # === Tensor Operations ===
    "einops==0.4.1",
    "opt_einsum==3.3.0",
    "networkx==2.8.6",
    
    # === nnUNetv2/SEALS specific ===
    "nnunet>=1.7.1",  # v1 for SEALS (Docker-compatible)
    "nnunetv2>=2.6.2",  # v2 for future algorithms compatibility
    "acvl-utils>=0.2.3,<0.3",
    "dynamic-network-architectures>=0.4.1,<0.5",
    "batchgenerators>=0.25.1",
    "batchgeneratorsv2>=0.3.0",
    "connected-components-3d>=3.12.0",
    "tifffile",
    "requests",
    "graphviz",
    "imagecodecs",
    "seaborn",
    "yacs",
    "blosc2>=3.0.0b1",
    
    # === Utilities ===
    "tqdm>=4.65.0",
    "PyYAML>=6.0.1",
    "six==1.16.0",
    "plotly==5.10.0",
    "matplotlib>=3.6.3",
    "colorama",
    "gdown",
    "evalutils==0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# PyTorch with CUDA support requires extra index URL:
# CUDA 11.8: --extra-index-url https://download.pytorch.org/whl/cu118
# CUDA 12:   --extra-index-url https://download.pytorch.org/whl/cu121
# CUDA 13:   --extra-index-url https://download.pytorch.org/whl/cu131
# CUDA version can be specified in setup_env.sh (argument) or Dockerfile (build arg)
# This is handled in setup_env.sh and Dockerfile

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_gpu: marks tests that require GPU",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

